<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Fundo com Gradiente Violet Moderno -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#violetGrad)"/>
  
  <!-- Símbolo de Documento Estilizado -->
  <rect x="14" y="10" width="22" height="28" rx="3" fill="white" fill-opacity="0.95"/>
  <path d="M20 18H32M20 23H28M20 28H24" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Check de Aprovação -->
